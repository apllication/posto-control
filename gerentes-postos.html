<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posto Control — Gerentes e Postos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
:root{--navy:#102a43;--blue:#1479c9;--green:#0c8b68;--ink:#172b3a;--muted:#617487;--line:#dce6ef;--paper:#f6f9fc;--danger:#c73b3b}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper)}.shell{max-width:1000px;margin:auto;padding:24px 18px 45px}.brand{font-weight:800;color:var(--navy);font-size:21px;margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.hero{background:linear-gradient(108deg,#102a43,#164b76);color:#fff;border-radius:18px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#d9eafb}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:var(--muted)}.danger{background:var(--danger);color:#fff}.muted{color:var(--muted);font-size:12px}.msg{margin-top:10px;font-weight:700}.ok{color:var(--green)}.err{color:var(--danger)}.hidden{display:none!important}.menu-wrap{position:relative}.dots{width:42px;height:42px;padding:0;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:25px;line-height:1;cursor:pointer}.menu{display:none;position:absolute;right:0;top:48px;z-index:20;min-width:205px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,42,67,.16);padding:7px}.menu.open{display:block}.menu button,.menu a{display:block;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);text-decoration:none;text-align:left;font:inherit;cursor:pointer}.menu button:hover,.menu a:hover{background:#edf3f8}.manager{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 60px 16px 16px;margin-top:10px}.manager strong{display:block;color:var(--navy);font-size:17px}.manager .manager-dots{position:absolute;right:10px;top:10px;background:#edf3f8;color:var(--navy);font-size:22px}.manager .menu{top:48px}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:600px){.menu{right:0}.manager{padding-right:55px}}
</style>
</head>
<body>
<main class="shell">
<div class="brand">⛽ Posto Control</div>
<section id="login" class="card">
<h2>Acesso do supervisor</h2><p class="muted">Entre para administrar gerentes e postos.</p>
<form id="loginForm"><p><input id="username" autocomplete="username" required placeholder="Usuário" style="width:100%;padding:11px;border:1px solid #cddae6;border-radius:9px;font:inherit"></p><p><input id="password" type="password" autocomplete="current-password" required placeholder="Senha" style="width:100%;padding:11px;border:1px solid #cddae6;border-radius:9px;font:inherit"></p><button class="btn primary">Entrar</button></form>
<div id="loginMsg" class="msg err"></div>
</section>
<section id="app" class="hidden">
<div class="hero">
<div class="top"><div><h1>Gerentes e postos cadastrados</h1><p>Visualize os cadastros e administre os acessos.</p></div>
<div class="menu-wrap"><button id="mainMenuBtn" class="dots" type="button" aria-label="Abrir menu">⋮</button><div id="mainMenu" class="menu">
<a href="painel-supervisor.html">⚙️ Configurações</a><a href="gerentes-postos.html">👤 Gerentes e postos</a><a href="painel-supervisor.html">↩️ Voltar ao painel</a><button id="logoutMenu" type="button">🚪 Sair</button>
</div></div></div>
</div>
<section class="card"><div class="top"><div><h2>Cadastros</h2><p class="muted">Os nomes dos gerentes e postos são os cadastrados no sistema.</p></div><button id="refresh" class="btn secondary">↻ Atualizar</button></div><div id="list"></div><div id="msg" class="msg"></div></section>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let profile=null;
const client=window.supabase.createClient(window.POSTO_CONTROL_SUPABASE.url,window.POSTO_CONTROL_SUPABASE.publishableKey);
function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}
function loginMsg(t){$('loginMsg').textContent=t}
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function closeMenus(){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'))}
$('mainMenuBtn').onclick=e=>{e.stopPropagation();$('mainMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))closeMenus()});
async function load(){const {data,error}=await client.from('profiles').select('id,username,full_name,station,created_at').eq('role','manager').order('full_name');if(error)throw error;const rows=data||[];$('list').innerHTML=rows.length?rows.map(m=>`<div class="manager"><button type="button" class="dots manager-dots" data-menu="menu-${esc(m.id)}" aria-label="Mais opções">⋮</button><div><strong>${esc(m.full_name)}</strong><div class="muted">Usuário: ${esc(m.username)} · Posto: ${esc(m.station)}</div><div class="muted">Cadastro: ${new Date(m.created_at).toLocaleDateString('pt-BR')}</div></div><div id="menu-${esc(m.id)}" class="menu"><button type="button" class="delete" data-id="${esc(m.id)}" data-name="${esc(m.full_name)}">🗑 Excluir gerente</button></div></div>`).join(''):'<div class="empty">Nenhum gerente cadastrado.</div>';
$('list').querySelectorAll('.manager-dots').forEach(b=>b.onclick=e=>{e.stopPropagation();const menu=$(b.dataset.menu);document.querySelectorAll('#list .menu.open').forEach(m=>{if(m!==menu)m.classList.remove('open')});menu.classList.toggle('open')});
$('list').querySelectorAll('.delete').forEach(b=>b.onclick=()=>{closeMenus();removeManager(b.dataset.id,b.dataset.name)});
}
async function removeManager(id,name){if(!confirm(`Excluir o gerente ${name}?\n\nO acesso dele será removido e os dados de vendas vinculados também serão excluídos.`))return;msg('Excluindo...');try{const {data,error}=await client.functions.invoke('delete-manager',{body:{id}});if(error)throw error;if(data?.error)throw new Error(data.error);msg(`Gerente ${name} excluído com sucesso.`,true);await load()}catch(e){msg(e.message||'Não foi possível excluir o gerente.')}}
async function authenticate(){const {data,error}=await client.auth.getSession();if(error||!data.session)return false;const {data:p,error:pe}=await client.from('profiles').select('*').eq('id',data.session.user.id).single();if(pe||p?.role!=='supervisor')return false;profile=p;return true}
async function showApp(){if(!(await authenticate()))return;$('login').style.display='none';$('app').classList.remove('hidden');try{await load()}catch(e){msg(e.message||'Não foi possível carregar os gerentes.')}}
$('loginForm').onsubmit=async e=>{e.preventDefault();loginMsg('Entrando...');try{const {error}=await client.auth.signInWithPassword({email:$('username').value.trim().toLowerCase()+'@posto-control.local',password:$('password').value});if(error)throw error;await showApp();if($('app').classList.contains('hidden'))loginMsg('Acesso permitido apenas ao supervisor.')}catch(e){loginMsg(e.message||'Usuário ou senha inválidos.')}};
$('refresh').onclick=()=>load().catch(e=>msg(e.message||'Erro ao atualizar.'));
async function logout(){await client.auth.signOut();location.reload()}
$('logoutMenu').onclick=logout;showApp();
</script>
</body></html>
