<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest-gerente.webmanifest"><title>Posto Control — Gerente</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--navy:#102a43;--blue:#1479c9;--green:#0c8b68;--ink:#172b3a;--muted:#617487;--line:#dce6ef;--paper:#f6f9fc;--white:#fff;--danger:#c73b3b}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper)}.shell{max-width:1050px;margin:auto;padding:24px 18px 45px}.brand{font-weight:800;color:var(--navy);font-size:21px;margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.hero{background:linear-gradient(108deg,#102a43,#164b76);color:#fff;border-radius:18px;padding:25px;margin-bottom:18px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#d9eafb}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.form{display:grid;gap:13px}label{display:grid;gap:6px;font-weight:700;font-size:13px;color:#43596d}input,select{width:100%;padding:10px;border:1px solid #cddae6;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3f8;color:var(--muted)}.danger{background:#fff0f0;color:var(--danger)}.actions{display:flex;gap:9px;justify-content:flex-end}.login{max-width:390px;margin:10vh auto}.msg{margin-top:10px;font-weight:700}.ok{color:var(--green)}.err{color:var(--danger)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:15px;border-radius:12px;background:#f3f8fc}.metric b{display:block;font-size:22px;color:var(--navy);margin-top:4px}.muted{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line)}th{color:var(--muted);font-size:12px}.num{text-align:right}.hidden{display:none}.late{background:#fff0f0;color:#b42318;font-weight:800}.ontime{color:var(--green);font-weight:700}.install{display:none;margin-bottom:12px;width:100%;font-size:16px;padding:13px}.call-alert{border:2px solid #c73b3b;background:#fff0f0;animation:pulse 1s infinite}.call-alert strong{font-size:18px;color:#b42318}@keyframes pulse{50%{box-shadow:0 0 0 7px #c73b3b22}}@media(max-width:760px){.grid,.metrics{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head>
<body>
<section id="login" class="login card"><div class="brand">⛽ Posto Control</div><h1>Acesso do gerente</h1><p class="muted">Use seu usuário e senha cadastrados pelo supervisor.</p><form id="loginForm" class="form"><label>Usuário<input id="username" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary">Entrar</button></form><div id="loginMsg" class="msg err"></div></section>
<main id="app" class="shell hidden">
<div class="brand">⛽ Posto Control <button id="installBtn" class="btn green install">📲 Instalar aplicativo</button><button id="logout" class="btn secondary" style="float:right">Sair</button></div>
<div class="hero"><h1 id="title">Painel do gerente</h1><p id="stationText"></p></div>
<div id="call" class="card call-alert hidden"><strong>🔔🚨 O supervisor está chamando você!</strong><div id="callDetail" class="muted"></div><div class="actions"><button id="ack" class="btn primary">✓ Entendido</button></div></div>
<div class="card"><h2>Envio diário</h2><p id="deadlineText" class="muted"></p><div id="sendStatus" class="msg"></div></div>
<div class="grid"><section class="card"><h2>Nova atualização de vendas</h2><form id="saleForm" class="form"><label>Data<input id="date" type="date" required></label><label>Gasolina comum (litros)<input id="common" type="number" min="0" step="0.01" required></label><label>Gasolina flex (litros)<input id="flex" type="number" min="0" step="0.01" required></label><div class="actions"><button class="btn secondary" type="reset">Limpar</button><button class="btn primary">Enviar medição</button></div></form><div id="saleMsg" class="msg"></div></section>
<aside class="card"><h2>Resumo</h2><div id="metrics" class="metrics"></div></aside></div>
<section class="card"><h2>Meus lançamentos</h2><div style="overflow:auto"><table><thead><tr><th>Data</th><th class="num">Comum</th><th class="num">Flex</th><th class="num">Total</th></tr></thead><tbody id="table"></tbody></table></div></section>
</main>
<script>
let profile=null,rows=[],deadline='18:00',timer,lastCallId=null,deferredPrompt=null,audioCtx=null;const $=id=>document.getElementById(id);function br(n){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}function msg(el,text,ok=false){el.textContent=text;el.className='msg '+(ok?'ok':'err')}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function deadlineMinutes(){const [h,m]=deadline.split(':').map(Number);return h*60+m}function minutesNow(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function prepareAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function alarm(){prepareAudio();try{if(audioCtx){const now=audioCtx.currentTime;[0,.35,.7,1.05].forEach((offset,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.0001,now+offset);g.gain.exponentialRampToValueAtTime(.45,now+offset+.02);g.gain.exponentialRampToValueAtTime(.0001,now+offset+.25);o.connect(g).connect(audioCtx.destination);o.start(now+offset);o.stop(now+offset+.27)})}}catch(e){}if('vibrate' in navigator){try{navigator.vibrate([700,250,700,250,1200,300,700])}catch(e){}}try{if(Notification.permission==='granted')new Notification('Posto Control — CHAMADA',{body:'O supervisor está chamando você.'})}catch(e){}}
async function load(){rows=await PostoControl.sales();rows=rows.filter(r=>r.manager_id===profile.id);deadline=await PostoControl.settings();render();renderSendStatus()}
function render(){const totalCommon=rows.reduce((s,r)=>s+Number(r.common_liters||0),0),totalFlex=rows.reduce((s,r)=>s+Number(r.flex_liters||0),0);$('metrics').innerHTML=`<div class="metric"><span>Comum</span><b>${br(totalCommon)} L</b></div><div class="metric"><span>Flex</span><b>${br(totalFlex)} L</b></div><div class="metric"><span>Total</span><b>${br(totalCommon+totalFlex)} L</b></div>`;if(!rows.length){$('table').innerHTML='<tr><td colspan="4">Nenhum lançamento ainda.</td></tr>';return}$('table').innerHTML=rows.map(r=>`<tr><td>${new Date(r.sale_date+'T12:00:00').toLocaleDateString('pt-BR')}</td><td class="num">${br(r.common_liters)} L</td><td class="num">${br(r.flex_liters)} L</td><td class="num">${br(Number(r.common_liters||0)+Number(r.flex_liters||0))} L</td></tr>`).join('')}
function renderSendStatus(){const sent=rows.some(r=>r.sale_date===today());const late=minutesNow()>deadlineMinutes();$('deadlineText').textContent=`Horário limite para envio hoje: ${deadline}.`;if(sent){$('sendStatus').textContent='✓ Medição de hoje enviada.';$('sendStatus').className='msg ok'}else if(late){$('sendStatus').textContent='⚠ ENVIO ATRASADO — a medição de hoje ainda não foi enviada.';$('sendStatus').className='msg err'}else{$('sendStatus').textContent='Medição de hoje ainda pendente.';$('sendStatus').className='msg'} }
async function checkCall(){const calls=await PostoControl.calls();const c=calls.find(x=>x.station===profile.station&&x.status==='pending');if(c){$('call').classList.remove('hidden');$('callDetail').textContent='Chamado registrado em '+new Date(c.created_at).toLocaleString('pt-BR');if(c.id!==lastCallId){lastCallId=c.id;alarm()}}else{$('call').classList.add('hidden');lastCallId=null}}
$('ack').onclick=async()=>{if(!lastCallId)return;const id=lastCallId;try{await PostoControl.dismissCall(id);$('call').classList.add('hidden');lastCallId=null;msg($('callDetail'),'✓ Chamado finalizado.',true)}catch(e){msg($('callDetail'),e.message||'Não foi possível finalizar o chamado.')}};
$('loginForm').onsubmit=async e=>{e.preventDefault();prepareAudio();$('loginMsg').textContent='Entrando...';try{const p=await PostoControl.login($('username').value,$('password').value);if(p.role!=='manager')throw new Error('Esta conta não é de gerente.');profile=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('stationText').textContent=`${p.full_name} · ${p.station}`;try{if(Notification.permission==='default')await Notification.requestPermission()}catch(e){}await load();await checkCall();clearInterval(timer);timer=setInterval(()=>{if(profile){load().catch(()=>{});checkCall().catch(()=>{});renderSendStatus()}},5000);PostoControl.subscribeSales(load);PostoControl.subscribeCalls(checkCall)}catch(e){msg($('loginMsg'),e.message||'Usuário ou senha inválidos.')}};
$('saleForm').onsubmit=async e=>{e.preventDefault();try{const common=Number($('common').value),flex=Number($('flex').value);if(common<0||flex<0)throw new Error('Informe valores válidos.');await PostoControl.insertSale({manager_id:profile.id,station:profile.station,sale_date:$('date').value,common_liters:common,flex_liters:flex});msg($('saleMsg'),'Medição enviada e salva no banco online.',true);$('common').value='';$('flex').value='';await load()}catch(e){msg($('saleMsg'),e.message||'Não foi possível salvar.')}};
$('logout').onclick=async()=>{await PostoControl.logout();location.reload()};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'};window.addEventListener('appinstalled',()=>{$('installBtn').style.display='none';deferredPrompt=null});
(async()=>{try{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');const s=await PostoControl.session();if(s){profile=await PostoControl.profile();if(profile?.role==='manager'){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('stationText').textContent=`${profile.full_name} · ${profile.station}`;await load();await checkCall();clearInterval(timer);timer=setInterval(()=>{if(profile){load().catch(()=>{});checkCall().catch(()=>{});renderSendStatus()}},5000)}}}catch(e){}})();
</script>
<script>(function(){const cfg=window.POSTO_CONTROL_SUPABASE;if(!cfg)throw new Error('Configuração ausente');window.PostoControl={client:window.supabase.createClient(cfg.url,cfg.publishableKey),emailFor:u=>String(u).trim().toLowerCase()+'@posto-control.local',async login(u,p){const {data,error}=await this.client.auth.signInWithPassword({email:this.emailFor(u),password:p});if(error)throw error;const {data:profile,error:pe}=await this.client.from('profiles').select('*').eq('id',data.user.id).single();if(pe)throw pe;return profile},async session(){const {data}=await this.client.auth.getSession();return data.session},async profile(){const s=await this.session();if(!s)return null;const {data,error}=await this.client.from('profiles').select('*').eq('id',s.user.id).single();if(error)throw error;return data},async logout(){await this.client.auth.signOut()},async sales(){const {data,error}=await this.client.from('sales').select('*').order('sale_date',{ascending:false});if(error)throw error;return data||[]},async insertSale(r){const {data,error}=await this.client.from('sales').insert(r).select().single();if(error)throw error;return data},async settings(){const {data,error}=await this.client.from('app_settings').select('*').eq('key','submission_deadline').maybeSingle();if(error)throw error;return data?.value||'18:00'},async calls(){const {data,error}=await this.client.from('manager_calls').select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]},async dismissCall(id){const {error}=await this.client.from('manager_calls').update({status:'responded',responded_at:new Date().toISOString()}).eq('id',id);if(error)throw error},subscribeSales(cb){return this.client.channel('sales-manager').on('postgres_changes',{event:'*',schema:'public',table:'sales'},cb).subscribe()},subscribeCalls(cb){return this.client.channel('calls-manager').on('postgres_changes',{event:'*',schema:'public',table:'manager_calls'},cb).subscribe()}}})()</script>
</body></html>
